# 재사용 워크플로: arm64 이미지를 빌드해 GHCR에 올린다 (ADR 0024)
# 호출하는 레포의 기본 브랜치에서만 올리고, 그 밖(PR 등)에서는 빌드만 해 Dockerfile을 검사한다.
# 입력은 추가만 한다. 호환이 깨지는 변경은 새 워크플로 파일로 낸다(앱 레포는 @main으로 호출한다)
name: build-image

on:
  workflow_call:
    inputs:
      image:
        description: 서비스 이름. ghcr.io/<org>/shop-sim-<image>로 올린다
        required: true
        type: string
      context:
        description: 빌드 컨텍스트 경로 (호출하는 레포 기준)
        required: true
        type: string
      file:
        description: Dockerfile 경로. 비우면 <context>/Dockerfile
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    # 호출하는 job도 이 권한 이상을 줘야 한다
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.ref_name == github.event.repository.default_branch }}
    steps:
      # 액션은 커밋 SHA로 고정한다(태그는 옮길 수 있다). 주석의 버전은 사람이 읽는 용도
      # 재사용 워크플로 안의 checkout은 호출한 레포를 받는다
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # 태그는 커밋 SHA 하나(sha-<7자>), 움직이는 태그는 두지 않는다.
      # 라벨 org.opencontainers.image.source가 호출한 레포를 가리켜, 처음 올릴 때 패키지가 그 레포에 연결된다
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/shop-sim-${{ inputs.image }}
          tags: type=sha
          flavor: latest=false
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 이미지마다 캐시를 나눈다. mode=max는 중간 단계 레이어까지 저장한다
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,scope=${{ inputs.image }},mode=max
