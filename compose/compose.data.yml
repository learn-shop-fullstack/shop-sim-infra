# 운영(staging·production) 데이터 서비스. 앱(compose.app.yml)과 같은 프로젝트로 합쳐 띄운다.
# 호스트 포트를 열지 않는다. 앱 컨테이너만 서비스 이름(postgres:5432 등)으로 접속한다
# 메모리 상한은 architecture.md "배포 환경" 예산표를 따른다. 바꾸면 예산표도 함께 고친다

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      # 18부터 데이터가 /var/lib/postgresql/18/docker에 생기므로 상위 디렉터리를 마운트한다
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:8.8.4-trixie
    # 컨테이너 상한보다 낮게 잡아, 상한에 닿기 전에 Redis가 쓰기를 거부하게 한다.
    # 스트림·Pub/Sub 데이터를 조용히 지우지 않도록 축출하지 않는다(noeviction)
    command: ["redis-server", "--maxmemory", "150mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 200m

volumes:
  postgres-data:
  redis-data:
