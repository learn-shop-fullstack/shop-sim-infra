# 운영(staging·production) 데이터 서비스. 앱(compose.app.yml)과 같은 프로젝트로 합쳐 띄운다.
# 호스트 포트를 열지 않는다. 앱 컨테이너만 서비스 이름(postgres:5432 등)으로 접속한다
# 메모리 상한은 architecture.md "배포 환경" 예산표를 따른다. 바꾸면 예산표도 함께 고친다

services:
  postgres:
    image: postgres:18.6-trixie
    # 기본값은 상한(1g)을 모른다. shared_buffers는 상한의 25%, effective_cache_size는 플래너 추정용(할당 없음)으로
    # 상한 안의 캐시 크기를 알려 준다. 최악 추정: 256MB + 50연결 × (프로세스 약 5MB + work_mem 4MB) ≈ 710MiB
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=640MB", "-c", "max_connections=50"]
    # 병렬 쿼리가 /dev/shm을 쓴다. Docker 기본값 64MB는 모자랄 수 있다(OrbStack은 더 크게 주지만 명시한다)
    shm_size: 128m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      # 18부터 데이터가 /var/lib/postgresql/18/docker에 생기므로 상위 디렉터리를 마운트한다
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:8.8.4-trixie
    # 컨테이너 상한보다 낮게 잡아, 상한에 닿기 전에 Redis가 쓰기를 거부하게 한다.
    # 스트림·Pub/Sub 데이터를 조용히 지우지 않도록 축출하지 않는다(noeviction)
    command: ["redis-server", "--maxmemory", "150mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 200m

  # KRaft 단일 노드: 한 프로세스가 브로커와 컨트롤러를 겸한다
  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 데이터 볼륨과 짝이다. 바꾸면 기존 볼륨으로 시작하지 못한다. 환경마다 볼륨이 따로라 같은 값을 쓴다
      CLUSTER_ID: lIUNNF7XRyCL_HZQ7sRkYw
      # 호스트에서 접속하는 앱이 없어 개발용의 HOST 리스너는 두지 않는다
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 노드가 하나라 내부 토픽 복제 수를 기본값 3에서 1로 낮춘다
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # 토픽은 명시적으로 만든다. 이름 오타가 새 토픽이 되지 않게 한다
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # 기본 설정은 /tmp에 쓰므로 이미지가 선언한 볼륨 경로로 바꾼다
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # kafka-*.sh 도구는 실행마다 JVM을 새로 띄우므로 포트 확인으로 대신한다
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  # Nori 플러그인을 넣은 이미지. CI(opensearch-image 워크플로)가 ../opensearch/Dockerfile을 빌드해 올린다.
  # 태그는 그 이미지를 만든 커밋(sha-<7자>)이라 Dockerfile을 바꾸면 새 태그로 고친다
  opensearch:
    image: ghcr.io/learn-shop-fullstack/shop-sim-opensearch:sha-012c4af
    environment:
      discovery.type: single-node
      # 보안 플러그인(TLS·인증)을 끈다. 호스트 포트가 없고 같은 프로젝트의 컨테이너만 접속한다
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms768m -Xmx768m
      # 힙이 스왑으로 밀려나지 않게 메모리를 잠근다 (아래 memlock과 함께)
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s'"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [data]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 번들 플러그인 포함 대기 1.39GiB + 부하 시 Direct 버퍼 증가분을 감안 (architecture.md 예산표)
          memory: 2g

# ADR 0027: 데이터 서비스는 외부 출구가 없는 네트워크에만 둔다. 같은 네트워크의 api·worker만 닿는다
networks:
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  opensearch-data:
