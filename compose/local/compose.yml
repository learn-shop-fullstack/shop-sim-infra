# 개발용 데이터 스택. 앱 레포(api·web·loadtest)가 이 파일을 띄워 개발한다.
# 운영 compose와 섞이지 않도록 프로젝트 이름을 따로 쓴다.
name: shop-sim-dev

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 18부터 데이터가 /var/lib/postgresql/18/docker에 생기므로 상위 디렉터리를 마운트한다
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:8.8.4-trixie
    # 컨테이너 상한보다 낮게 잡아, 상한에 닿기 전에 Redis가 쓰기를 거부하게 한다.
    # 스트림·Pub/Sub 데이터를 조용히 지우지 않도록 축출하지 않는다(noeviction)
    command: ["redis-server", "--maxmemory", "150mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 200m

  # 운영의 Cloudflare R2를 대신하는 S3 호환 저장소 (#2에서 MinIO 대신 선정)
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    # R2처럼 없는 버킷에 올리면 실패하도록 자동 생성을 끈다
    command: ["mini", "-s3.autoCreateBucket=false", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      S3_BUCKET: ${S3_BUCKET:?}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
