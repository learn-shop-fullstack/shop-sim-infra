# 개발용 데이터 스택. 앱 레포(api·web·loadtest)가 이 파일을 띄워 개발한다.
# 운영 compose와 섞이지 않도록 프로젝트 이름을 따로 쓴다.
name: shop-sim-dev

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 18부터 데이터가 /var/lib/postgresql/18/docker에 생기므로 상위 디렉터리를 마운트한다
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:8.8.4-trixie
    # 컨테이너 상한보다 낮게 잡아, 상한에 닿기 전에 Redis가 쓰기를 거부하게 한다.
    # 스트림·Pub/Sub 데이터를 조용히 지우지 않도록 축출하지 않는다(noeviction)
    command: ["redis-server", "--maxmemory", "150mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 200m

  # 운영의 Cloudflare R2를 대신하는 S3 호환 저장소 (#2에서 MinIO 대신 선정)
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    # R2처럼 없는 버킷에 올리면 실패하도록 자동 생성을 끈다
    command: ["mini", "-s3.autoCreateBucket=false", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      S3_BUCKET: ${S3_BUCKET:?}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m

  # KRaft 단일 노드: 한 프로세스가 브로커와 컨트롤러를 겸한다
  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: lIUNNF7XRyCL_HZQ7sRkYw
      # INTERNAL은 compose 안의 컨테이너용(kafka:19092), HOST는 호스트에서 실행하는 앱용
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 노드가 하나라 내부 토픽 복제 수를 기본값 3에서 1로 낮춘다
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # 운영처럼 토픽은 명시적으로 만든다. 이름 오타가 새 토픽이 되지 않게 한다
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # 기본 설정은 /tmp에 쓰므로 이미지가 선언한 볼륨 경로로 바꾼다
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # kafka-*.sh 도구는 실행마다 JVM을 새로 띄우므로 포트 확인으로 대신한다
      test: ["CMD", "nc", "-z", "localhost", "19092"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g

  # 필요할 때만 띄운다: docker compose --profile tools up -d kafka-ui
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    profiles: [tools]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      # 토픽·메시지를 손으로 바꾸지 않도록 기본은 읽기 전용. 실험 중에만 .env에서 false로
      KAFKA_CLUSTERS_0_READONLY: ${KAFKA_UI_READONLY:-true}
      JAVA_OPTS: -Xms128m -Xmx256m
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
  kafka-data:
