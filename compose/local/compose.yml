# 개발용 데이터 스택. 앱 레포(api·web·loadtest)가 이 파일을 띄워 개발한다.
# 운영 compose와 섞이지 않도록 프로젝트 이름을 따로 쓴다.
name: shop-sim-dev

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 18부터 데이터가 /var/lib/postgresql/18/docker에 생기므로 상위 디렉터리를 마운트한다
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  postgres-data:
